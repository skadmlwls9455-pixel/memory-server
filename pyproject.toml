[project]
name = "memory-server"
version = "0.1.0"
description = "개인 AI 기억 시스템: 로컬 MCP 서버 (SPEC v0.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
]

[project.scripts]
memory = "memory_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
