[project]
name = "memory-server"
version = "0.1.0"
description = "개인 AI 기억 시스템: 로컬 MCP 서버 (SPEC v0.3)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2",
    "pyyaml>=6.0",
    "sqlite-vec>=0.1.6",
    "sentence-transformers>=3.0",
    "torch>=2.2",
]

[project.scripts]
memory = "memory_server.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "anyio>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memory_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 리눅스(CI, 컨테이너)에서는 CPU 전용 torch 를 받는다. macOS 는 PyPI 기본 휠(MPS 포함)을 쓴다.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
